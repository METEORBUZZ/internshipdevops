services:
  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-staging-app
    ports:
      - "5051:5000"
    environment:
      - APP_ENV=staging
      - APP_DEBUG=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
