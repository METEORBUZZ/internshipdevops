name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Core Concepts and Skills"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run system info script
        run: |
          chmod +x system-info.sh
          ./system-info.sh

      - name: Build Docker image
        run: docker build -t my-web-app .
